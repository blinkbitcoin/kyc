# The service itself. Its whole configuration is the Secret: capabilities
# follow DATABASE_URL, so this same Deployment serves access tokens alone or
# access tokens plus session orchestration.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyc-service
  labels:
    app.kubernetes.io/name: kyc-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kyc-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kyc-service
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: kyc-service
          image: ghcr.io/blinkbitcoin/kyc-service:latest
          ports:
            - name: http
              containerPort: 5100
          envFrom:
            - secretRef:
                name: kyc-service
          env:
            - name: PORT
              value: "5100"
            # Behind the Service and an ingress: key the rate limits on the
            # forwarded client, not on the proxy
            - name: TRUST_PROXY
              value: "true"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
