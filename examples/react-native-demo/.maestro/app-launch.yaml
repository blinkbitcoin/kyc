# Maestro E2E: launch smoke test - the app boots to the idle verification
# screen with the bundled mode inlined. Fast-fail signal for broken builds
# before the longer flows run.
#
# This is the ONLY flow that (re)launches the app cold (see config.yaml).
appId: ${APP_ID} # iOS: org.reactjs.native.example.ReactNativeSandbox / Android: com.reactnativesandbox
---
# The one cold launch: driver install + app boot + bundle load. A driver
# error inside the first wait aborts the wait rather than polling on, so the
# whole flow is retried as a unit.
- retry:
    maxRetries: 2
    commands:
      - launchApp
      - extendedWaitUntil:
          visible:
            id: "verification-start-button"
          timeout: 60000
      - assertVisible:
          id: "mode-label"
      - assertVisible:
          id: "reset-button"
      - assertVisible:
          id: "outcome"
      - assertVisible: "no outcome yet"
