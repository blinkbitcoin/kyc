# Fill this in (or replace it with your secret manager's output) before
# applying. Every name here means the same thing on every deploy target.
#
# Every key in THIS Secret is an environment variable: the Deployment and the
# migrate Job consume it with `envFrom`, and kubelet refuses (and reports as
# an InvalidVariableNames event) any key that is not a valid variable name.
# Sumsub authenticates with an app token and a secret key - strings, so
# nothing here needs a mounted file.
apiVersion: v1
kind: Secret
metadata:
  name: kyc-service
type: Opaque
stringData:
  # Session verification: one of these two (JWT_SECRET is an accepted alias
  # of SESSION_HS256_SECRET)
  SESSION_JWKS_URL: "https://id.example.com/.well-known/jwks.json"
  # SESSION_HS256_SECRET: "change-me"

  # Session orchestration; remove it to deploy access tokens alone
  DATABASE_URL: "postgresql://kyc:change-me@postgres:5432/kyc"
  # The hosted page URL handed to clients is <PUBLIC_BASE_URL>/hosted/<id>,
  # and its origin is what the apps pin postMessage to
  PUBLIC_BASE_URL: "https://kyc.example.com"
  CORS_ALLOWED_ORIGINS: "https://app.example.com"

  KYC_PROVIDER: "sumsub"
  KYC_ENV: "production"
  SUMSUB_APP_TOKEN: "change-me"
  SUMSUB_SECRET_KEY: "change-me"
  SUMSUB_WEBHOOK_SECRET: "change-me"
  SUMSUB_LEVEL_NAME: "basic-kyc-level"
