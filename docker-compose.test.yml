# Docker Compose configuration for E2E tests
# Uses tmpfs for RAM-backed ephemeral storage (faster writes, auto-cleanup)
# Host port KYC_TEST_DB_PORT (KYC_PORT_BASE + 4, default 5104 - the table is
# scripts/lib/ports.mjs; scripts/e2e/test-db.sh exports it), clear of the dev
# database on 5432 and of other repos' test databases.

services:
  postgres-test:
    image: postgres:15
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: kyc_test
    ports:
      - "${KYC_TEST_DB_PORT:-5104}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      # -h forces a TCP check: the default Unix-socket probe reports ready
      # while Postgres's first-boot restart still has the TCP listener down,
      # which is exactly the window the E2E suite connects in.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U test -d kyc_test"]
      interval: 2s
      timeout: 5s
      retries: 10
