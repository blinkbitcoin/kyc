name: CodeQL

# Advanced-setup CodeQL: the same default query suite GitHub's "Default setup"
# would run, as a workflow, because the Code Security toggle on the repo's
# Advanced Security page is gated at the org level. Free on a public repo.
# Informational: not a required check in the main ruleset, so a runner hiccup
# cannot block a merge. Alerts land under Security -> Code scanning.

# No paths-ignore: it was a second, narrower copy of the docs list that
# disagreed with the classifier (it knew nothing about LICENSE or the
# templates), so a documentation change still paid for a full analysis. The
# Changes job below asks the same question ci.yml does, once.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1' # weekly, so new queries re-scan an idle main

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The same classifier ci.yml's Checks stage uses (scripts/lib/docs-only.mjs).
  # A scheduled run has no base to diff, so it classifies as "run everything" -
  # which is what the weekly re-scan of an idle main is for.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the PR base / the commit a push replaced

      - name: Classify changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: node scripts/ci/changed-class.mjs

  analyze:
    name: Analyze
    needs: [changes]
    # Nothing to analyse when no code moved. CodeQL is informational and not
    # a required check, so a skip here blocks nothing.
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # workflow metadata for the upload
      security-events: write # upload SARIF results

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # No build step: JS/TS is extracted from source, no autobuild needed.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # The query suite and the alert-suppression query (what makes an
          # inline `codeql[rule-id]` marker count) live in the config file.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
