<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Your React Native or React web app renders one IdentityVerification component. The end user photographs an ID document, takes a selfie with a liveness check, and gets a verdict: approved, pending or declined. A VerificationSource picks one of three modes: a hosted page embedded in a hardened WebView or origin-pinned iframe, the native provider SDK in-process, or a proxy session on the reference backend. The two backend-backed modes go through the optional packages/kyc-service service, and every mode ends at Sumsub.">
  <title>blinkbitcoin/kyc: one IdentityVerification component, three verification sources, one provider</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <!-- canvas -->
  <rect x="0.5" y="0.5" width="959" height="399" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- ===== Column 1: your app, the journey the end user sees ===== -->
  <text x="150" y="40" text-anchor="middle" text-rendering="geometricPrecision" font-size="13" font-weight="700" fill="#334155" letter-spacing="1">YOUR APP</text>

  <!-- browser window (behind): the same journey on the web -->
  <g transform="translate(112 66)">
    <rect x="0" y="0" width="176" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="0" y="0" width="176" height="16" rx="8" fill="#e2e8f0"/>
    <rect x="0" y="9" width="176" height="7" fill="#e2e8f0"/>
    <circle cx="11" cy="8" r="3" fill="#f87171"/>
    <circle cx="21" cy="8" r="3" fill="#fbbf24"/>
    <circle cx="31" cy="8" r="3" fill="#34d399"/>
    <!-- selfie in an iframe -->
    <rect x="100" y="30" width="62" height="46" rx="4" fill="#0f172a"/>
    <ellipse cx="131" cy="53" rx="13" ry="16" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="3 2"/>
    <circle cx="131" cy="48" r="5" fill="#334155"/>
    <path d="M122 66 Q131 58 140 66" fill="#334155"/>
    <rect x="100" y="86" width="62" height="14" rx="7" fill="#2563eb"/>
    <rect x="14" y="34" width="76" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="14" y="44" width="62" height="4" rx="2" fill="#e2e8f0"/>
    <rect x="14" y="54" width="70" height="4" rx="2" fill="#e2e8f0"/>
    <rect x="14" y="64" width="50" height="4" rx="2" fill="#e2e8f0"/>
  </g>

  <!-- phone (front): document, selfie, verdict -->
  <g transform="translate(44 54)">
    <rect x="0" y="0" width="118" height="212" rx="16" fill="#0f172a"/>
    <rect x="6" y="8" width="106" height="196" rx="10" fill="url(#screen)"/>
    <rect x="43" y="12" width="32" height="6" rx="3" fill="#0f172a"/>

    <!-- step 1: ID document inside capture brackets -->
    <rect x="22" y="32" width="74" height="46" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="38" cy="52" r="8" fill="#e2e8f0"/>
    <rect x="52" y="43" width="34" height="4" rx="2" fill="#e2e8f0"/>
    <rect x="52" y="52" width="34" height="4" rx="2" fill="#e2e8f0"/>
    <rect x="52" y="61" width="22" height="4" rx="2" fill="#e2e8f0"/>
    <path d="M18 34 V26 H26 M100 34 V26 H92 M18 76 V84 H26 M100 76 V84 H92" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>

    <!-- step 2: selfie with a liveness ring -->
    <rect x="22" y="94" width="74" height="54" rx="5" fill="#0f172a"/>
    <ellipse cx="59" cy="121" rx="15" ry="19" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="59" cy="115" r="6" fill="#334155"/>
    <path d="M47 138 Q59 126 71 138" fill="#334155"/>

    <!-- step 3: the verdict -->
    <rect x="22" y="158" width="74" height="30" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="36" cy="173" r="8" fill="#b2f2bb"/>
    <path d="M32 173 L35 176.5 L40.5 170" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="49" y="177" font-size="9.5" font-weight="700" fill="#166534">approved</text>

    <rect x="43" y="196" width="32" height="4" rx="2" fill="#334155"/>
  </g>

  <!-- the three steps, and the outcomes -->
  <text x="150" y="286" text-anchor="middle" font-size="11.5" fill="#64748b">ID document · selfie &amp; liveness · decision</text>
  <g transform="translate(48 296)">
    <rect x="0" y="0" width="60" height="18" rx="9" fill="#dcfce7"/>
    <text x="30" y="12.5" text-anchor="middle" font-size="9.5" font-weight="600" fill="#166534">approved</text>
    <rect x="66" y="0" width="56" height="18" rx="9" fill="#fef3c7"/>
    <text x="94" y="12.5" text-anchor="middle" font-size="9.5" font-weight="600" fill="#92400e">pending</text>
    <rect x="128" y="0" width="60" height="18" rx="9" fill="#fee2e2"/>
    <text x="158" y="12.5" text-anchor="middle" font-size="9.5" font-weight="600" fill="#991b1b">declined</text>
  </g>

  <!-- component chip -->
  <g transform="translate(36 326)">
    <rect x="0" y="0" width="228" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="114" y="17" text-anchor="middle" font-size="11" fill="#1d4ed8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&lt;IdentityVerification source /&gt;</text>
  </g>
  <text x="150" y="372" text-anchor="middle" font-size="11" fill="#94a3b8">React Native · React web</text>

  <!-- ===== Column 2: the three sources ===== -->
  <text x="500" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#334155" letter-spacing="1">PICK ONE VERIFICATION SOURCE</text>

  <g transform="translate(340 70)">
    <rect x="0" y="0" width="320" height="58" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="26" cy="29" r="13" fill="#2563eb"/>
    <text x="26" y="34" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
    <text x="50" y="25" font-size="14" font-weight="700" fill="#0f172a">Hosted page</text>
    <text x="50" y="43" font-size="11.5" fill="#64748b">hardened WebView · origin-pinned iframe · no Apollo</text>
  </g>

  <g transform="translate(340 140)">
    <rect x="0" y="0" width="320" height="58" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="26" cy="29" r="13" fill="#2563eb"/>
    <text x="26" y="34" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
    <text x="50" y="25" font-size="14" font-weight="700" fill="#0f172a">Native SDK</text>
    <text x="50" y="43" font-size="11.5" fill="#64748b">provider SDK in-process · your backend mints the token</text>
  </g>

  <g transform="translate(340 210)">
    <rect x="0" y="0" width="320" height="58" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="26" cy="29" r="13" fill="#2563eb"/>
    <text x="26" y="34" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
    <text x="50" y="25" font-size="14" font-weight="700" fill="#0f172a">Proxy session</text>
    <text x="50" y="43" font-size="11.5" fill="#64748b">sessions · token refresh · webhook-backed status</text>
  </g>

  <text x="500" y="296" text-anchor="middle" font-size="11.5" fill="#64748b">one component, one hook - only the source changes</text>
  <text x="500" y="314" text-anchor="middle" font-size="11" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">useIdentityVerification · onStatusChange · onComplete · onError</text>

  <!-- ===== Column 3: provider and backend ===== -->
  <text x="818" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#334155" letter-spacing="1">PROVIDER</text>

  <g transform="translate(738 64)">
    <rect x="0" y="0" width="160" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="80" y="27" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Sumsub</text>
    <text x="80" y="45" text-anchor="middle" font-size="10.5" fill="#64748b">Mobile SDK · Web SDK · REST</text>
  </g>

  <g transform="translate(738 172)">
    <rect x="0.5" y="0.5" width="159" height="95" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="5 4"/>
    <text x="80" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">packages/kyc-service</text>
    <text x="80" y="38" text-anchor="middle" font-size="10.5" fill="#64748b">reference backend · optional</text>
    <text x="80" y="52" text-anchor="middle" font-size="10.5" fill="#64748b">GraphQL · hosted page · webhooks</text>
    <g transform="translate(64 62)">
      <path d="M0 6 V22 A16 6 0 0 0 32 22 V6" fill="#f1f5f9" stroke="#cbd5e1"/>
      <ellipse cx="16" cy="6" rx="16" ry="6" fill="#e2e8f0" stroke="#cbd5e1"/>
    </g>
  </g>

  <!-- ===== Arrows ===== -->
  <line x1="292" y1="150" x2="330" y2="150" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <!-- 1 and 3 go to the backend; 2 goes straight to the provider, hopping over the other line -->
  <path d="M660 99 H716 V220 H732" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M660 239 H716 V220" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M660 169 H690 V104 A5 5 0 0 1 690 94 H732" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="818" y1="170" x2="818" y2="128" stroke="#64748b" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="826" y="152" font-size="10.5" fill="#64748b">REST + webhooks</text>

  <!-- ===== Footer: the four packages ===== -->
  <line x1="300" y1="340" x2="920" y2="340" stroke="#e2e8f0"/>
  <text x="610" y="366" text-anchor="middle" font-size="11.5" fill="#64748b">@blinkbitcoin/kyc-core · kyc-node · kyc-react-native · kyc-react</text>
</svg>
